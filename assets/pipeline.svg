<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Flujo animado: datos entran, se transforman, pasan por un control de seguridad que bloquea solicitudes maliciosas y terminan en decisiones">
  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="898" height="298" rx="14"/></clipPath>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7A1734" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C98CA0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C98CA0" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#C98CA0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2A0F17"/><stop offset="1" stop-color="#1F1013"/>
    </linearGradient>
  </defs>
  <g font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
  <rect x="1" y="1" width="898" height="298" rx="14" fill="url(#bg)" stroke="#7A1734" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#grid)"/>
    <rect x="-160" y="0" width="160" height="300" fill="url(#sweep)">
      <animate attributeName="x" values="-160;900" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="30" y="40" font-size="12" letter-spacing="2" fill="#C98CA0">FLUJO DE TRABAJO · DATOS → SEGURIDAD → DECISIÓN</text>
  <g>
    <circle cx="742" cy="36" r="4" fill="#7FD1A0"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="754" y="40" font-size="12" fill="#F4DCE1">pipeline activo</text>
  </g>

  <!-- conectores con flujo -->
  <g stroke="#C98CA0" stroke-width="2" stroke-dasharray="6 6" opacity="0.55" fill="none">
    <path d="M180,130 H240"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></path>
    <path d="M390,130 H484"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></path>
    <path d="M556,130 H660"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></path>
  </g>

  <!-- paquetes de datos -->
  <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#C98CA0">
    <animateMotion path="M180,130 H660" dur="6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#C98CA0;#C98CA0;#F4DCE1;#F4DCE1" keyTimes="0;0.3;0.31;1" dur="6s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#C98CA0">
    <animateMotion path="M180,130 H660" dur="6s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#C98CA0;#C98CA0;#F4DCE1;#F4DCE1" keyTimes="0;0.3;0.31;1" dur="6s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#C98CA0">
    <animateMotion path="M180,130 H660" dur="6s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#C98CA0;#C98CA0;#F4DCE1;#F4DCE1" keyTimes="0;0.3;0.31;1" dur="6s" begin="4s" repeatCount="indefinite"/>
  </rect>
  <g>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#E07A84" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateMotion path="M180,130 H484" keyPoints="0;1;1" keyTimes="0;0.633;1" calcMode="linear" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.63;0.66;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </path>
    <circle cx="484" cy="130" r="0" fill="none" stroke="#E07A84" stroke-width="2">
      <animate attributeName="r" values="0;0;24;24" keyTimes="0;0.633;0.78;1" dur="6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0;0" keyTimes="0;0.633;0.78;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="66" text-anchor="middle" font-size="11" fill="#E07A84" opacity="0">
      solicitud bloqueada
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.633;0.68;0.82;0.9;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>
  <g>
    <path d="M-5,-5 L5,5 M5,-5 L-5,5" stroke="#E07A84" stroke-width="2.4" stroke-linecap="round" fill="none">
      <animateMotion path="M180,130 H484" keyPoints="0;1;1" keyTimes="0;0.633;1" calcMode="linear" dur="6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.63;0.66;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="484" cy="130" r="0" fill="none" stroke="#E07A84" stroke-width="2">
      <animate attributeName="r" values="0;0;24;24" keyTimes="0;0.633;0.78;1" dur="6s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0;0" keyTimes="0;0.633;0.78;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="66" text-anchor="middle" font-size="11" fill="#E07A84" opacity="0">
      solicitud bloqueada
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.633;0.68;0.82;0.9;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- pulso del escudo -->
  <circle cx="520" cy="130" r="30" fill="none" stroke="#C98CA0" stroke-width="2">
    <animate attributeName="r" values="34;70" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="130" r="30" fill="none" stroke="#C98CA0" stroke-width="2">
    <animate attributeName="r" values="34;70" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- nodo 1: fuentes -->
  <rect x="30" y="75" width="150" height="110" rx="12" fill="#1F1013" stroke="#C98CA0" stroke-opacity="0.6" stroke-width="1.5"/>
  <g stroke="#F4DCE1" stroke-width="1.8" fill="none" stroke-linecap="round">
    <ellipse cx="105" cy="92" rx="16" ry="5.5"/>
    <path d="M89 92v14c0 3 7 5.5 16 5.5s16-2.5 16-5.5V92"/>
    <path d="M89 99c0 3 7 5.5 16 5.5s16-2.5 16-5.5"/>
  </g>
  <text x="105" y="142" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F4DCE1">FUENTES</text>
  <text x="105" y="162" text-anchor="middle" font-size="11" fill="#C98CA0">Excel · CSV · APIs</text>

  <!-- nodo 2: transformación -->
  <rect x="240" y="75" width="150" height="110" rx="12" fill="#1F1013" stroke="#C98CA0" stroke-opacity="0.6" stroke-width="1.5"/>
  <g stroke="#F4DCE1" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M298 86h34l-13 15v15l-8-5v-10z"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <text x="315" y="142" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F4DCE1">LIMPIEZA</text>
  <text x="315" y="162" text-anchor="middle" font-size="11" fill="#C98CA0">SQL · Power Query</text>

  <!-- escudo: control de seguridad -->
  <path d="M520 82 L558 96 V130 C558 156 541 174 520 184 C499 174 482 156 482 130 V96 Z" fill="#1F1013" stroke="#F4DCE1" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M520 92 L548 102 V130 C548 150 536 164 520 172 C504 164 492 150 492 130 V102 Z" fill="#7A1734" fill-opacity="0.55"/>
  <path d="M504 132 L516 144 L538 118" fill="none" stroke="#F4DCE1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;0.25;0.85;1" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="520" y="212" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F4DCE1">CONTROL</text>
  <text x="520" y="230" text-anchor="middle" font-size="11" fill="#C98CA0">validación · acceso · cifrado</text>

  <!-- nodo 4: decisión -->
  <rect x="660" y="75" width="210" height="110" rx="12" fill="#1F1013" stroke="#C98CA0" stroke-opacity="0.6" stroke-width="1.5"/>
  <g fill="#F4DCE1">
    <rect x="732" width="14" rx="2"><animate attributeName="height" values="10;24;16;10" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="108;94;102;108" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="757" width="14" rx="2" fill="#C98CA0"><animate attributeName="height" values="20;12;26;20" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="98;106;92;98" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="782" width="14" rx="2"><animate attributeName="height" values="14;26;20;14" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="104;92;98;104" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <text x="765" y="142" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.5" fill="#F4DCE1">DECISIÓN</text>
  <text x="765" y="162" text-anchor="middle" font-size="11" fill="#C98CA0">Dashboards · Reportes</text>

  <!-- leyenda -->
  <g font-size="11" fill="#F4DCE1">
    <rect x="30" y="268" width="9" height="9" rx="2" fill="#C98CA0"/><text x="46" y="277">dato crudo</text>
    <rect x="150" y="268" width="9" height="9" rx="2" fill="#F4DCE1"/><text x="166" y="277">dato validado</text>
    <path d="M285 268l9 9m0-9l-9 9" stroke="#E07A84" stroke-width="2" stroke-linecap="round"/><text x="302" y="277">solicitud bloqueada</text>
  </g>
  </g>
</svg>
