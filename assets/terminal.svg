  <g font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace">
    <rect x="1" y="1" width="898" height="338" rx="14" fill="#160B0E" stroke="#7A1734" stroke-width="2"/>
    <g clip-path="url(#frame)">
      <rect x="1" y="1" width="898" height="40" fill="url(#bar)"/>
      <!-- barrido tipo escáner -->
      <rect x="0" y="41" width="900" height="3" fill="#C98CA0" opacity="0.0">
        <animate attributeName="y" values="41;336" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.22;0.22;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="26" cy="21" r="6" fill="#B24A5E"/><circle cx="48" cy="21" r="6" fill="#C9A0A8"/><circle cx="70" cy="21" r="6" fill="#7A5A62"/>
    <text x="450" y="26" text-anchor="middle" font-size="12" fill="#F4DCE1">alejandro@portafolio: ~/seguridad-y-datos</text>
    <text x="34" y="68" font-size="12" fill="#8A6F76"># así trabajo: canales seguros, despliegue y reportes (ilustrativo)</text>
    <g>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.86;0.93;1" dur="20.0s" repeatCount="indefinite"/>
      <text x="34" y="100" font-size="14" xml:space="preserve" clip-path="url(#c0)"><tspan fill="#C98CA0">$ </tspan><tspan fill="#F4DCE1">./canal-seguro --handshake</tspan></text>
<text x="34" y="124" font-size="14" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">RSA · intercambio de llaves</tspan></text>
<text x="34" y="148" font-size="14" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">Diffie-Hellman · secreto compartido</tspan></text>
<text x="34" y="172" font-size="14" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">AES · cifrado de la sesión</tspan></text>
<text x="34" y="196" font-size="14" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">HMAC · integridad del mensaje verificada</tspan></text>
<text x="34" y="220" font-size="14" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#C98CA0">$ </tspan><tspan fill="#F4DCE1">./desplegar --destino fly.io</tspan></text>
<text x="34" y="244" font-size="14" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">servicio arriba · health check en verde</tspan></text>
<text x="34" y="268" font-size="14" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#C98CA0">$ </tspan><tspan fill="#F4DCE1">./reporte --fuente ventas.csv</tspan></text>
<text x="34" y="292" font-size="14" xml:space="preserve" clip-path="url(#c8)"><tspan fill="#7FD1A0">[ok] </tspan><tspan fill="#F4DCE1">datos limpiados · 3 indicadores listos</tspan></text>

      <rect x="34" y="301" width="9" height="18" fill="#F4DCE1">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
